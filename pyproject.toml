[project]
name = "examlens"
version = "0.1.0"
description = "Student results analytics dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"webui.py" = ["E501"]
"pages/*.py" = ["E501"]
"src/examlens/viewmodel.py" = ["E501"]
"src/examlens/certificates.py" = ["E501"]
"tests/test_certificates.py" = ["E501"]
"scripts/psd_to_template.py" = ["E501"]
