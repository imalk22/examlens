<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DA9FF"/>
      <stop offset="0.5" stop-color="#0A72FF"/>
      <stop offset="1" stop-color="#5B47F5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.82"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
    <clipPath id="glass"><circle cx="452" cy="452" r="214"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1460" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
  <g filter="url(#soft)">
    <!-- lens glass -->
    <circle cx="452" cy="452" r="250" fill="#fff" fill-opacity="0.14"/>
    <!-- rising results bars, seen through the lens -->
    <g clip-path="url(#glass)">
      <rect x="338" y="468" width="60" height="112" rx="18" fill="url(#bar)" fill-opacity="0.72"/>
      <rect x="422" y="392" width="60" height="188" rx="18" fill="url(#bar)" fill-opacity="0.86"/>
      <rect x="506" y="312" width="60" height="268" rx="18" fill="url(#bar)"/>
    </g>
    <!-- lens ring and handle -->
    <circle cx="452" cy="452" r="250" fill="none" stroke="#fff" stroke-width="70"/>
    <line x1="640" y1="640" x2="806" y2="806" stroke="#fff" stroke-width="104" stroke-linecap="round"/>
  </g>
</svg>
